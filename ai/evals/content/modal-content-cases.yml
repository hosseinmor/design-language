    content:
      title: ApplicationEntity را حذف می‌کنید؟
      primary_action: حذف ApplicationEntity
      safe_exit: انصراف
    expected:
      valid: false
      checked_rules: [MOD-002, MOD-017]
      violations: [MOD-002, MOD-017]

  - id: raw_dynamic_identifier_breaks_direction
    context:
      component: Modal
      surrounding_direction: rtl
      identifier: JV-4821
      bidi_isolated: false
    content:
      title: درخواست JV-4821 را حذف می‌کنید؟
      primary_action: حذف درخواست
      safe_exit: انصراف
    expected:
      valid: false
      checked_rules: [MOD-018]
      violations: [MOD-018]

  - id: multi_step_application_forced_into_modal
    context:
      component: Modal
      steps: 7
      navigation_heavy: true
      dedicated_flow_available: true
    content:
      title: تکمیل درخواست شغلی
      body: هفت مرحله را برای ارسال درخواست کامل کنید.
      primary_action: شروع
    expected:
      valid: false
      checked_rules: [MOD-001, MOD-019]
      violations: [MOD-001, MOD-019]

  - id: emotional_pressure_in_confirmation
    context:
      component: Modal
      modal_type: confirmation
      urgency_confirmed: false
    content:
      title: واقعاً می‌خواهید این فرصت طلایی را از دست بدهید؟
      body: با خروج، آیندهٔ شغلی خود را به خطر می‌اندازید.
      primary_action: با تأسف خارج می‌شوم
      safe_exit: حفظ فرصت من
    expected:
      valid: false
      checked_rules: [MOD-002, MOD-006, MOD-020]
      violations: [MOD-002, MOD-006, MOD-020]
