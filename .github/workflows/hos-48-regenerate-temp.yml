name: Regenerate HOS-48 indexes (temporary)

on:
  push:
    branches:
      - docs/hos-48-number-input-unit-behavior

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'chore(registry): regenerate for HOS-48'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/hos-48-number-input-unit-behavior
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Regenerate canonical registry with repo tool
        run: |
          python tooling/generate_manifest.py generate
          python tooling/generate_component_mapping_index.py generate
      - name: Run validation
        run: |
          python tooling/generate_manifest.py check
          python tooling/generate_component_mapping_index.py check
          python tooling/validate_links.py
          python tooling/validators/check_ai_governance.py
          python tooling/validators/check_accessibility_knowledge.py
      - name: Commit generated files back to the PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/manifest.generated.json registry/graph.generated.json integrations/component-mapping-index.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(registry): regenerate for HOS-48"
            git push origin HEAD:docs/hos-48-number-input-unit-behavior
          fi
