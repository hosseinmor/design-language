name: Regenerate Value Summary indexes (temporary)

on:
  push:
    branches:
      - docs/value-summary-number-input-pattern

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: docs/value-summary-number-input-pattern
          persist-credentials: true
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Use repository generators
        run: |
          python tooling/generate_manifest.py generate
          python tooling/generate_component_mapping_index.py generate
      - name: Validate generated outputs and linked references
        run: |
          python tooling/generate_manifest.py check
          python tooling/generate_component_mapping_index.py check
          python tooling/validate_links.py
          python tooling/validators/check_ai_governance.py
          python tooling/validators/check_accessibility_knowledge.py
      - name: Commit generated output to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/manifest.generated.json registry/graph.generated.json integrations/component-mapping-index.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(registry): regenerate for Value Summary"
            git push origin HEAD:docs/value-summary-number-input-pattern
          fi
