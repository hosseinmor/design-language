name: Design Language quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Check registry freshness
        run: python tooling/generate_manifest.py check

      - name: Check component mapping index freshness
        run: python tooling/generate_component_mapping_index.py check

      - name: Check relative links
        run: python tooling/validate_links.py

      - name: Check accessibility knowledge
        run: python tooling/validators/check_accessibility_knowledge.py

      - name: Check content terminology
        run: python tooling/validators/check_content_terminology.py

      - name: Check content localization
        run: python tooling/validators/check_content_localization.py

      - name: Check content component contracts
        run: python tooling/validators/check_content_components.py

      - name: Check content patterns
        run: python tooling/validators/check_content_patterns.py
