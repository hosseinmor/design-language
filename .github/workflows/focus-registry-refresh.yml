name: Temporary Focus registry refresh

on:
  push:
    branches:
      - docs/focus-visibility-contract
    paths:
      - .github/workflows/focus-registry-refresh.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/focus-visibility-contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Generate registry
        run: python tooling/generate_manifest.py generate

      - name: Commit generated registry
        run: |
          if git diff --quiet -- registry/manifest.generated.json registry/graph.generated.json; then
            echo "Registry already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry/manifest.generated.json registry/graph.generated.json
          git commit -m "chore(registry): regenerate Focus visibility metadata"
          git push origin HEAD:docs/focus-visibility-contract
