name: HOS-52 temporary registry refresh

on:
  push:
    branches:
      - feat/hos-52-side-navigation-contract

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install repository validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate canonical registry artifacts
        run: |
          python tooling/generate_manifest.py generate
          python tooling/generate_component_mapping_index.py generate
      - name: Commit generated artifacts if necessary
        run: |
          if ! git diff --quiet -- registry/manifest.generated.json registry/graph.generated.json integrations/component-mapping-index.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add registry/manifest.generated.json registry/graph.generated.json integrations/component-mapping-index.md
            git commit -m "chore(registry): refresh HOS-52 hover-expanded navigation"
            git push
          else
            echo "Generated artifacts already current"
          fi
