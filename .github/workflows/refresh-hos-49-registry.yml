name: Temporary HOS-49 registry artifact

on:
  push:
    branches:
      - feat/hos-49-unified-time-picker

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Generate registry
        run: python tooling/generate_manifest.py generate

      - name: Upload generated registry
        uses: actions/upload-artifact@v4
        with:
          name: hos-49-generated-registry
          path: |
            registry/manifest.generated.json
            registry/graph.generated.json
          if-no-files-found: error
