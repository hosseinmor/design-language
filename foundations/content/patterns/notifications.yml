schema_version: "0.1"
id: content.pattern.notifications
title: الگوی محتوایی اعلان‌ها و بازخورد نتیجه
status: draft
language: fa-IR
scope:
  - inline-feedback
  - inline-notification
  - toast
  - outcome-feedback

depends_on:
  voice: content.foundation.product_voice
  terminology: content.foundation.terminology
  error_pattern: content.pattern.error
  confirmation_pattern: content.pattern.confirmation
  design_system:
    - design-system.component.notification
    - design-system.pattern.notifications
    - design-system.accessibility.dynamic-content-and-feedback

goal: >
  کاربر بدون قطع بی‌دلیل task بفهمد چه نتیجه یا وضعیتی رخ داده، به کدام action
  یا object مربوط است و در صورت نیاز چه گام بعدی معناداری دارد.

tone_profiles:
  info: informational_feedback
  success: success_feedback
  warning: warning_feedback
  error: error_feedback

# مجموعهٔ severityها، کنارگذاشتن Danger و treatment دیداری متعلق به
# design-system.pattern.notifications است. این الگو فقط معنی هر severity را برای
# نوشتن مالک است (DS: «Semantic Color and Content System own severity meanings and wording»).
severity_model:
  set_owner: design-system.pattern.notifications
  info:
    meaning: واقعیت یا تغییر وضعیت خنثی که دانستن آن برای task مفید است.
  success:
    meaning: action واقعاً کامل و نتیجهٔ مورد انتظار ثبت یا اعمال شده است.
  warning:
    meaning: ریسک، محدودیت یا وضعیت ناپایداری که هنوز شکست قطعی نیست.
  error:
    meaning: action یا سیستم شکست خورده است؛ recovery از error pattern می‌آید.

# انتخاب درون‌صفحه‌ای، Inline Notification، Toast یا Modal تصمیم presentation است.
# شکل نمایش ورودی نوشتن است، نه خروجی این الگو.
presentation_owner: design-system.pattern.notifications

rules:
  - id: NTF-001
    obligation: must
    dimension: classification
    key: classify_meaning_and_persistence
    statement: رویداد، severity معنایی و نیاز به ماندگاری پیش از نوشتن مشخص شود.
  - id: NTF-003
    obligation: must
    dimension: clarity
    key: name_actual_result
    statement: نتیجه یا وضعیت واقعی با action و object قابل‌فهم نام برده شود.
  - id: NTF-005
    obligation: must
    dimension: product_truth
    key: confirm_before_success
    statement: Success فقط پس از تأیید کامل‌شدن action اعلام شود.
  - id: NTF-006
    obligation: must
    dimension: clarity
    key: include_relevant_consequence
    statement: اگر نتیجه روی ادامهٔ task اثر دارد، پیامد یا گام بعدی معلوم بیان شود.
  - id: NTF-008
    obligation: must_not
    dimension: clarity
    key: generic_outcome_only
    statement: عبارت کلی مانند «عملیات با موفقیت انجام شد» بدون نام نتیجه کل پیام نباشد.
  - id: NTF-009
    obligation: must_not
    dimension: tone
    key: celebratory_hype
    statement: موفقیت معمولی با تحسین، هیجان، شعار یا ایموجی بزرگ‌نمایی نشود.
  - id: NTF-014
    obligation: must_not
    dimension: product_truth
    key: invent_runtime_behavior
    statement: زمان نمایش، محل، stacking یا dismissibility تعریف‌نشده اختراع نشود.
  - id: NTF-015
    obligation: must
    dimension: product_truth
    key: confirm_before_error
    statement: Error فقط پس از failure تأییدشده اعلام شود؛ وقتی نتیجه هنوز نامعلوم است، شکست قطعی گزارش نشود.

anatomy:
  required:
    - message
  conditional:
    - title
    - consequence_or_next_step
    - action
    - dismiss
  message_pattern: "[نتیجه یا وضعیت مشخص]. [پیامد مهم یا گام بعدی معلوم]."
  dismiss_label: بستن

# تعداد action، انتخاب Link یا Button و ماندگاری action در Toast متعلق به
# design-system.pattern.notifications است.
action_model:
  owner: design-system.pattern.notifications
  label: برچسب action نتیجهٔ واقعی activation را با اصطلاح همان surface نام ببرد (content.component.button).
  undo:
    rule: «بازگردانی» فقط وقتی نوشته شود که بازیابی واقعاً پیاده‌سازی، امن و در بازهٔ لازم قابل‌دسترسی است.

# فوریت announcement، focus و جلوگیری از بازخورد تکراری متعلق به
# design-system.pattern.notifications و design-system.accessibility.dynamic-content-and-feedback است.
accessibility:
  owner: design-system.accessibility.dynamic-content-and-feedback
  content_scope: متن پیام بدون اتکا به رنگ یا severity دیداری قابل‌فهم باشد و برچسب dismiss «بستن» است.

templates:
  success:
    message: "{object_or_action} {confirmed_result}."
    optional_follow_up: "{important_consequence_or_next_step}."
  info:
    message: "{neutral_state_or_change}."
  warning:
    message: "{detected_risk_or_limitation}. {known_effect_or_next_step}."
  error:
    message: "{failed_action_or_state}. {known_recovery}."

examples:
  resume_saved:
    severity: success
    presentation: toast
    message: تغییرات رزومه ذخیره شد.
  application_submitted:
    severity: success
    presentation: toast
    message: درخواست شغلی ارسال شد.
  unstable_connection:
    severity: warning
    presentation: inline_notification
    message: اتصال ناپایدار است؛ ممکن است ذخیرهٔ تغییرات بیشتر طول بکشد.
  saved_job_removed_with_undo:
    severity: success
    presentation: toast
    message: آگهی از ذخیره‌شده‌ها حذف شد.
    action: بازگردانی
    condition: undo_available_and_accessible

# شکاف‌های باز Design System؛ در copy پر نشوند (NTF-014).
unknowns:
  - مدت دقیق نمایش خودکار Toast
  - تعداد و ترتیب Toastهای هم‌زمان
  - جای‌گذاری و stacking در viewportهای مختلف
  - dismissibility پیش‌فرض هر نوع اعلان
  - رفتار action در Toast با سطح High تا زمان تثبیت inverse Button

retired_rules:
  - id: NTF-002
    superseded_by: [design-system.pattern.notifications]
    reason: انتخاب درون‌صفحه‌ای، Inline Notification یا Toast تصمیم presentation در Design System است.
  - id: NTF-004
    superseded_by: [VOICE-007]
    reason: تکرار قاعدهٔ عمومی اصطلاح canonical در product voice؛ عین LDP-008.
  - id: NTF-007
    superseded_by: [design-system.pattern.notifications]
    reason: سقف تعداد action تصمیم composition در Design System است.
  - id: NTF-010
    superseded_by: [design-system.pattern.notifications, content.pattern.confirmation]
    reason: کنارگذاشتن Danger از severityها تصمیم Design System است؛ هشدار پیش از action متعلق به confirmation است.
  - id: NTF-011
    superseded_by: [design-system.pattern.notifications, design-system.accessibility.dynamic-content-and-feedback]
    reason: فوریت announcement سازوکار دسترس‌پذیری است، نه wording.
  - id: NTF-012
    superseded_by: [design-system.pattern.notifications, design-system.accessibility.dynamic-content-and-feedback]
    reason: رفتار focus هنگام ظاهرشدن Toast متعلق به Design System و accessibility است.
  - id: NTF-013
    superseded_by: [design-system.pattern.notifications, design-system.accessibility.dynamic-content-and-feedback]
    reason: هماهنگی focus، live announcement و Toast سازوکار تعاملی است، نه wording.

evaluation_source: ../../../ai/evals/content/notification-cases.yml
