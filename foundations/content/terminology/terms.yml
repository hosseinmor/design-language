schema_version: "0.2"
id: content.foundation.terminology
title: واژه‌نامهٔ محتوای محصول جاب‌ویژن
status: draft
language: fa-IR
scope:
  - product-ui
  - product-documentation
  - ai-generated-product-content

description: >
  مدل معنایی اصطلاحات جاب‌ویژن. این فایل مفهوم محصول، نام کدی و برچسب
  مناسب هر مخاطب را از هم جدا می‌کند. واژه‌های allowed، avoid و forbidden
  فقط در محدوده‌ای که برایشان تعریف شده اعمال می‌شوند.

precedence:
  - product_truth_and_safety
  - accessibility_and_usability
  - domain_and_surface_rules
  - persian_language_rules
  - brand_expression

sources:
  - id: source_glossary
    title: واژه‌نامهٔ جاب‌ویژن
    url: https://docs-jv.jvoffice.ir/contents/00-glossary/
    state: draft
    role: product_truth_and_code_mapping
    reviewed_on: 2026-09-23
  - id: product_content_decisions
    title: تصمیم‌های Product Content System
    state: working_decisions
    role: user_facing_language
  - id: candidate_runtime_review
    title: تجربهٔ فعلی پنل کارجو جاب‌ویژن
    url: https://jobvision.ir/my-cv
    state: observed
    role: runtime_product_evidence
    reviewed_on: 2026-09-23

policy:
  concept_and_label:
    - هر id یک مفهوم مستقل را نشان می‌دهد، نه صرفاً یک رشتهٔ متنی را.
    - canonical_internal نام مرجع مفهوم در دانش محصول است.
    - preferred برچسب مناسب هر مخاطب یا سطح را تعیین می‌کند.
  term_severity:
    allowed: واژهٔ مجاز ولی نه لزوماً انتخاب اول
    avoid: ترجیحاً استفاده نشود؛ خطای non-blocking
    forbidden: در scope مشخص استفاده نشود؛ خطای blocking
  context_rules:
    - forbidden_as_synonym فقط جایگزینی نادرست یک مفهوم را منع می‌کند و ممنوعیت مطلق واژه نیست.
    - واژهٔ کوتاه فقط زمانی مجاز است که مفهوم در همان سطح بدون ابهام باشد.
    - نام‌های code_only نباید مستقیماً وارد UI کارجو یا کارفرما شوند.
  unresolved_marker: needs_decision

terms:
  # Core employment concepts
  - id: job_post
    concept_kind: entity
    canonical_internal: آگهی
    definition:
      source: اعلان یک موقعیت شغلی توسط سازمان.
      product_content: >
        موجودیت منتشرشده در جاب‌ویژن که اطلاعات یک موقعیت شغلی را
        به کارجو نمایش می‌دهد.
    preferred:
      default: آگهی شغلی
      jobseeker: آگهی شغلی
      employer: آگهی
      admin: آگهی
    forbidden_as_synonym:
      - موقعیت شغلی
      - فرصت شغلی
      - آگهی استخدام
      - وکنسی
    domains: [jobseeker, employer, ats, admin]
    visibility: [public, internal]
    relations:
      represents: job_position
      distinct_from: [job_position, job_opportunity]
    code_bindings: [JobPost]
    status: stable
    evidence: [source_glossary, product_content_decisions]

  - id: job_position
    concept_kind: entity
    canonical_internal: موقعیت شغلی
    definition:
      product_content: نقش یا جایگاه واقعی‌ای که یک سازمان برای آن نیرو می‌خواهد.
    preferred:
      default: موقعیت شغلی
    use_when:
      - اشاره به خود نقش یا جایگاه
      - اقدام یا تصمیم جذب برای یک نقش
    forbidden_as_synonym_of: [job_post, job_opportunity]
    domains: [jobseeker, employer, ats]
    visibility: [public, internal]
    relations:
      represented_by: job_post
      distinct_from: [job_post, job_opportunity]
    status: stable
    evidence: [product_content_decisions]

  - id: job_opportunity
    concept_kind: communication_concept
    canonical_internal: فرصت شغلی
    definition:
      product_content: امکان پیدا کردن یا شروع یک شغل؛ نه یک موجودیت دقیق محصول.
    preferred:
      default: فرصت شغلی
    use_when: [discovery, recommendation, general_product_copy]
    avoid_when: [specific_product_entity, status_or_metadata]
    forbidden_as_synonym_of: [job_post, job_position]
    domains: [jobseeker, marketing]
    visibility: [public]
    relations:
      distinct_from: [job_post, job_position]
    status: stable
    evidence: [product_content_decisions]

  - id: recruitment
    concept_kind: process
    canonical_internal: جذب
    definition:
      product_content: >
        فرایند پیدا کردن، بررسی، ارزیابی و پیش بردن افراد تا رسیدن
        به تصمیم استخدام.
    preferred:
      default: جذب
    examples: [فرایند جذب, درخواست جذب, تیم جذب, در حال جذب]
    forbidden_as_synonym_of: [hiring]
    relations:
      leads_to: hiring
      distinct_from: [hiring]
    domains: [employer, ats]
    visibility: [public, internal]
    status: stable
    evidence: [product_content_decisions]

  - id: hiring
    concept_kind: outcome
    canonical_internal: استخدام
    definition:
      product_content: >
        تصمیم یا نتیجه‌ای که فرد در آن برای یک موقعیت وارد رابطهٔ استخدامی می‌شود.
    preferred:
      default: استخدام
    examples: [استخدام شد, تاریخ استخدام, تصمیم استخدام]
    forbidden_as_synonym_of: [recruitment]
    relations:
      result_of: recruitment
      distinct_from: [recruitment]
    domains: [employer, ats, jobseeker]
    visibility: [public, internal]
    status: stable
    evidence: [product_content_decisions]

  # People and organizations
  - id: employer_organization
    concept_kind: entity
    canonical_internal: سازمان
    definition:
      source: کارفرمای ثبت‌شده در سامانه که می‌تواند آگهی منتشر کند.
      product_content: سازمانی که از محصولات کارفرمایی جاب‌ویژن استفاده می‌کند.
    preferred:
      default: سازمان
      jobseeker: شرکت
      employer: سازمان
      ats: سازمان
      admin: سازمان
    allowed: [سازمان, شرکت]
    avoid: [مجموعه, بنگاه]
    forbidden_as_synonym:
      - term: کارفرما
        scope: entity_label
    domains: [jobseeker, employer, ats, admin]
    visibility: [public, internal]
    relations:
      distinct_from: [employer_actor, operator]
    code_bindings: [Company]
    status: stable
    evidence: [source_glossary, product_content_decisions]

  - id: employer_actor
    concept_kind: role
    canonical_internal: کارفرما
    definition:
      product_content: فرد یا نقش انسانی‌ای که از طرف یک سازمان در فرایند جذب نیرو عمل می‌کند.
    preferred:
      default: کارفرما
    forbidden_as_synonym_of: [employer_organization]
    domains: [jobseeker, employer, ats]
    visibility: [public, internal]
    relations:
      acts_for: employer_organization
      distinct_from: [employer_organization, operator]
    status: stable
    evidence: [product_content_decisions]

  - id: operator
    concept_kind: role
    canonical_internal: رابط
    definition:
      source: کاربری که از طرف یک سازمان در پنل کارفرما کار می‌کند.
    preferred:
      default: رابط
    source_forbidden: [اپراتور, کاربر سازمان, نمایندهٔ کارفرما]
    domains: [employer, admin]
    visibility: [internal, admin]
    relations:
      acts_for: employer_organization
      distinct_from: [employer_actor, job_fair_applier]
    code_bindings: [Operator]
    status: draft
    evidence: [source_glossary]

  - id: system_operator
    concept_kind: role
    canonical_internal: رابط سیستمی
    definition:
      source: رابطی که توسط جاب‌ویژن از طرف سازمان ساخته می‌شود.
    domains: [employer, admin]
    visibility: [internal, admin]
    code_bindings: [Operator]
    status: needs_decision
    open_questions:
      - نشانگر سیستمی و تفاوت رفتاری آن با رابط عادی دقیقاً چیست؟
    evidence: [source_glossary]

  - id: jobseeker
    concept_kind: role
    canonical_internal: کارجو
    definition:
      source: کاربری که برای یافتن شغل ثبت‌نام کرده است.
      product_content: >
        فردی که در جاب‌ویژن به دنبال فرصت شغلی است یا برای یک موقعیت
        درخواست شغلی فرستاده است.
    preferred:
      default: کارجو
    avoid: [متقاضی, داوطلب]
    forbidden_as_synonym: [کاندید, کاندیدا, جویای کار]
    domains: [jobseeker, employer]
    visibility: [public, internal]
    relations:
      distinct_from: [ats_candidate]
    code_bindings: [Candidate]
    status: stable
    evidence: [source_glossary, product_content_decisions]

  - id: ats_candidate
    concept_kind: role
    canonical_internal: کاندیدا
    definition:
      product_content: >
        فردی که در ATS برای یک یا چند موقعیت شغلی در حال بررسی است؛
        چه خودش درخواست شغلی فرستاده باشد و چه recruiter او را اضافه کرده باشد.
    preferred:
      ats: کاندیدا
    allowed: [کاندیدای جذب]
    avoid: [متقاضی, کارجو, داوطلب]
    domains: [ats]
    visibility: [public, internal]
    relations:
      distinct_from: [jobseeker]
    status: stable
    evidence: [product_content_decisions]

  - id: industry
    concept_kind: taxonomy
    canonical_internal: صنعت
    definition:
      source: حوزهٔ فعالیت کسب‌وکار سازمان که از بیس‌دیتا انتخاب می‌شود.
    preferred:
      default: صنعت
    source_forbidden: [حوزهٔ فعالیت, زمینهٔ کاری, رستهٔ شغلی]
    relations:
      distinct_from: [job_category]
    code_bindings: [CompanyIndustry]
    domains: [jobseeker, employer, admin]
    visibility: [public, internal]
    status: draft
    evidence: [source_glossary]

  - id: company_authentication
    concept_kind: process
    canonical_internal: احراز هویت سازمان
    definition:
      source: >
        جریان سه‌گامی اثبات ارتباط رابط با اشخاص ثبت‌شدهٔ سازمان؛ شامل
        کد پیامکی، شاهکار و تطبیق با فهرست اشخاص سازمان.
    preferred:
      default: احراز هویت سازمان
    source_forbidden: [تأیید سازمان, وریفای سازمان, احراز شاهکار]
    relations:
      distinct_from: [company_activation]
    code_bindings: [CompanyAuthentication]
    domains: [employer, admin]
    visibility: [public, internal]
    status: draft
    evidence: [source_glossary]

  - id: similar_company
    concept_kind: system_flag
    canonical_internal: سازمان مشابه
    definition:
      source: >
        سازمانی که یکی از پنج فیلد نام ثبتی، نام فارسی، نام انگلیسی،
        وب‌سایت یا تلفنش دقیقاً با سازمان دیگری برابر است.
    preferred:
      admin: سازمان مشابه
    source_forbidden: [سازمان تکراری, سازمان دوتایی]
    domains: [admin]
    visibility: [admin, internal]
    code_bindings: [SimilarCompanyId, SimilarReasonId]
    status: draft
    evidence: [source_glossary]

  - id: merge_company
    concept_kind: admin_action
    canonical_internal: ادغام سازمان
    definition:
      source: انتقال داده و موجودی یک سازمان به سازمان دیگر و حذف سازمان مبدأ.
    preferred:
      admin: ادغام سازمان
    source_forbidden: [مرج, یکی‌سازی سازمان]
    domains: [admin]
    visibility: [admin, internal]
    code_bindings: [MergeCompany]
    status: draft
    evidence: [source_glossary]

  - id: company_formal_info
    concept_kind: data_object
    canonical_internal: اطلاعات رسمی سازمان
    definition:
      source: هویت فاکتوری سازمان شامل شناسهٔ ملی، عنوان حقوقی، نشانی و کد پستی.
    preferred:
      employer: اطلاعات رسمی سازمان
      billing: اطلاعات رسمی
      admin: اطلاعات رسمی سازمان
    source_forbidden: [اطلاعات حقوقی, اطلاعات فاکتور, اطلاعات مالیاتی]
    domains: [employer, billing, admin]
    visibility: [public, internal]
    relations:
      distinct_from: [company_authentication, company_profile]
      reconciles_source_entries: [company_formal_info, formal_info]
    code_bindings: [CompanyFormalInfo]
    status: stable
    evidence: [source_glossary]

  - id: account_manager
    concept_kind: internal_role
    canonical_internal: اکانت‌منیجر
    definition:
      source: کارمند جاب‌ویژن که مسئول مجموعه‌ای از سازمان‌هاست؛ تخصیص بر اساس صنعت.
    preferred:
      internal: اکانت‌منیجر
    source_forbidden: [مدیر حساب, مسئول فروش]
    domains: [sales, admin]
    visibility: [internal, admin]
    code_bindings: [AccountManager]
    status: draft
    evidence: [source_glossary]

  # Resume and application concepts
  - id: blue_collar_job_post
    concept_kind: derived_classification
    canonical_internal: آگهی یقه آبی
    definition:
      source: آگهی‌ای که همهٔ دسته‌های شغلی‌اش سطح شغلی پیش‌فرض ۲ دارند.
    preferred:
      default: آگهی یقه آبی
    source_forbidden: [آگهی کارگری, آگهی سطح پایین, مشاغل ساده]
    domains: [jobseeker, employer, admin]
    visibility: [public, internal]
    code_bindings: [IsBlueCollarJob, isLowLevel]
    status: draft
    notes:
      - منطق تشخیص در صفحهٔ جزئیات با کارت و جست‌وجو یکسان نیست.
    evidence: [source_glossary]

  - id: resume
    concept_kind: entity
    canonical_internal: رزومه
    definition:
      source: سند مهارت‌ها و سوابق کارجو.
      product_content: >
        مفهوم واحد اطلاعات حرفه‌ای کارجو که می‌تواند نسخه‌های زبانی فارسی
        و انگلیسی داشته باشد.
    preferred:
      default: رزومه
    avoid: [CV, سی‌وی]
    forbidden_as_synonym: [پروفایل کاری, پروفایل کارجو]
    domains: [jobseeker, employer, ats]
    visibility: [public, internal]
    relations:
      has_variant: resume_language_variant
      distinct_from: [candidate_profile, personal_resume_file, resume_snapshot]
    code_bindings: [Cv]
    status: stable
    evidence: [source_glossary, product_content_decisions]

  - id: resume_language_variant
    concept_kind: localized_representation
    canonical_internal: نسخهٔ زبانی رزومه
    definition:
      product_content: >
        بازنمایی فارسی یا انگلیسی همان رزومه که محتوای زبانی و شاخص تکمیل
        مخصوص خود را دارد، اما در مدل محتوایی رزومهٔ مستقل دیگری نیست.
    preferred:
      default: نسخهٔ زبانی رزومه
      persian: رزومهٔ فارسی
      english: رزومهٔ انگلیسی
    avoid: [رزومهٔ دوم, رزومهٔ جداگانه]
    domains: [jobseeker, employer, application]
    visibility: [public, internal]
    relations:
      variant_of: resume
      distinct_from: [personal_resume_file, resume_snapshot]
    status: stable
    notes:
      - این مدل محتوایی دربارهٔ تعداد رکوردها یا ساختار ذخیره‌سازی ادعا نمی‌کند.
    evidence: [product_content_decisions]

  - id: resume_completion_percentage
    concept_kind: metric
    canonical_internal: درصد تکمیل رزومه
    definition:
      source: عدد صفر تا صد برای میزان پرشدن رزومه؛ برای فارسی و انگلیسی جداست.
    preferred:
      default: درصد تکمیل رزومه
    source_forbidden: [درصد رزومه, کامل بودن رزومه]
    domains: [jobseeker]
    visibility: [public, internal]
    relations:
      computed_for: resume_language_variant
    code_bindings: [CompletionPercentageFa, CompletionPercentageEn]
    status: draft
    notes:
      - صددرصد بودن لزوماً به معنای رزومهٔ پرمحتوا نیست.
    evidence: [source_glossary]

  - id: personal_resume_file
    concept_kind: artifact
    canonical_internal: رزومهٔ شخصی
    definition:
      source: فایلی که کارجو خودش بارگذاری می‌کند، در برابر رزومهٔ ساختاریافتهٔ جاب‌ویژن.
    preferred:
      default: رزومهٔ شخصی
    source_forbidden: [رزومهٔ آپلودی, فایل رزومه]
    domains: [jobseeker, employer]
    visibility: [public, internal]
    relations:
      distinct_from: [resume]
    status: draft
    evidence: [source_glossary]

  - id: recommendation
    concept_kind: resume_section
    canonical_internal: توصیه‌نامه
    definition:
      source: متنی که هم‌کار سابق دربارهٔ کارجو می‌نویسد.
    preferred:
      default: توصیه‌نامه
    source_forbidden: [رفرنس, معرفی‌نامه]
    domains: [jobseeker, employer]
    visibility: [public, internal]
    code_bindings: [CvFormerColleague.RecommendationText]
    status: draft
    evidence: [source_glossary]

  - id: job_application
    concept_kind: entity_and_action
    canonical_internal: درخواست شغلی
    definition:
      source: اقدام کارجو برای ارسال رزومه به یک آگهی مشخص.
    preferred:
      full: درخواست شغلی
      contextual: درخواست
    action_labels:
      allowed: [ارسال رزومه]
    source_forbidden_as_entity_label: [اپلای, ارسال رزومه, تقاضا, درخواست]
    rules:
      - در متن مستقل، notification و متن چنددامنه‌ای همیشه «درخواست شغلی» نوشته شود.
      - «درخواست» فقط در سطحی مجاز است که موضوع از عنوان یا ساختار صفحه روشن باشد.
      - «ارسال رزومه» نام عمل است، نه نام موجودیت.
    domains: [jobseeker, employer, ats]
    visibility: [public, internal]
    relations:
      distinct_from: [hiring_request, interview_invitation, generic_request]
    code_bindings: [Application]
    status: draft
    eval_rules:
      - TERM_AMBIGUOUS_WITHOUT_CONTEXT
    evidence: [source_glossary, product_content_decisions]

  - id: hiring_request
    concept_kind: entity
    canonical_internal: درخواست جذب
    definition:
      product_content: درخواست داخلی سازمان برای آغاز یا پیش‌برد جذب نیرو.
    preferred:
      default: درخواست جذب
    forbidden_as_synonym_of: [job_application, generic_request]
    domains: [employer, ats]
    visibility: [internal]
    relations:
      distinct_from: [job_application]
      part_of: recruitment
    status: stable
    evidence: [product_content_decisions]

  - id: resume_snapshot
    concept_kind: internal_artifact
    canonical_internal: اسنپشات رزومه
    definition:
      source: نسخهٔ کامل و منجمدشدهٔ رزومه در لحظهٔ ارسال درخواست شغلی.
    preferred:
      internal: اسنپشات رزومه
      user_facing_explanation: نسخهٔ رزومه در زمان ارسال درخواست شغلی
    source_forbidden: [عکس فوری, اسنپ‌شات, نسخهٔ رزومه, رزومهٔ ذخیره‌شده]
    domains: [application, employer, admin]
    visibility: [internal, admin]
    relations:
      snapshot_of: resume
    code_bindings: [ApplicationCandidate]
    status: draft
    evidence: [source_glossary]

  - id: employer_assistant
    concept_kind: automation
    canonical_internal: دستیار کارفرما
    definition:
      source: >
        سازوکاری که درخواست‌های شغلی بی‌تصمیمِ گذشته از مهلت آگهی را
        خودکار رد می‌کند و دو روز پیش از آن به رابط‌ها یادآوری می‌دهد.
    preferred:
      default: دستیار کارفرما
    source_forbidden_as_feature_name: [رد خودکار, اسیستنت]
    domains: [employer, application]
    visibility: [public, internal]
    relations:
      distinct_from: [ai_assistant, external_ai_screener]
    code_bindings: [EmployerAssistantSilentDays]
