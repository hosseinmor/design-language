schema_version: "0.7"
id: content.foundation.terminology.jobvision
product: jobvision
title: واژه‌نامهٔ محتوای محصول جاب‌ویژن
status: draft
language: fa-IR
extends: content.foundation.terminology

description: >
  برچسب‌های UI، قاعدهٔ زمینه و واژه‌های ممنوع جاب‌ویژن. معنی، رفتار و نگاشت فنی
  مفهوم‌ها در Product Knowledge جاب‌ویژن مرجع می‌ماند؛ definition و code_bindings
  این فایل snapshot ارجاعی‌اند، نه منبع حقیقت مستقل. production_alignment
  فاصلهٔ برچسب انتخاب‌شده با پروداکشن را در دورهٔ گذار نشان می‌دهد.


sources:
  - id: source_glossary
    title: واژه‌نامهٔ جاب‌ویژن
