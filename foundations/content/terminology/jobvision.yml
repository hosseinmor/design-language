  - id: resume
    concept_kind: entity
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: رزومه
    definition:
      source: سند مهارت‌ها و سوابق کارجو.
      product_content: >
        مفهوم واحد اطلاعات حرفه‌ای کارجو که می‌تواند نسخه‌های زبانی فارسی
        و انگلیسی داشته باشد.
