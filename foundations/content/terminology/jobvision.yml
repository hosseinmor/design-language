# مفهوم‌هایی که در relations ارجاع داده شده‌اند ولی هنوز مدخل ندارند.
# هر شناسهٔ تازه در relations باید یا مدخل داشته باشد یا اینجا ثبت شود.
unregistered_concepts: [application_rejection, business_rule, candidate_profile, company_activation, company_profile, formal_info, generic_request, interview_invitation, job_category, price, proforma_invoice, reactivation, resume_view, seniority_level, services]

terms:
  # Core employment concepts
  - id: job_post
    concept_kind: entity
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: pk_jobvision_jobpost_overview
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: JobPost
    definition:
      source: آگهی (JobPost) همان موقعیت شغلی در مدل محصول است.
      product_content: >
        موجودیت واحدی که سازمان برای یک موقعیت شغلی ثبت می‌کند و در طول
        ساخت، انتشار، نمایش به کارجو، دریافت درخواست و پایان انتشار باقی می‌ماند.
        «آگهی شغلی» و «موقعیت شغلی» دو برچسب زمینه‌ای برای همین موجودیت‌اند.
    preferred:
      default: آگهی شغلی
      jobseeker_listing: آگهی شغلی
      employer_management: آگهی
      admin_management: آگهی
      role_context: موقعیت شغلی
    contextual_labels:
      - label: آگهی شغلی
        use_when:
          - ثبت، ساخت، ویرایش، انتشار، توقف یا انقضای موجودیت
          - اشاره به وضعیت، شناسه، تاریخ انتشار، سهمیه یا metadata
          - اشاره به کارت یا صفحهٔ منتشرشده به‌عنوان listing
      - label: موقعیت شغلی
        use_when:
          - ارائهٔ همان موجودیت به‌عنوان نقش یا جایگاه قابل بررسی
          - شرح مسئولیت‌ها، شرایط، تناسب و اقدام کارجو برای درخواست
          - تصمیم‌ها و گفتگوهای جذب دربارهٔ نقش
    forbidden:
      - {label: فرصت شغلی, scope: concept, source: design_language}
      - {label: آگهی استخدام, scope: concept, source: design_language}
      - {label: وکنسی, scope: concept, source: design_language}
    domains: [jobseeker, employer, ats, admin]
    visibility: [public, internal]
    relations:
      same_entity_label: job_position
      distinct_from: [job_opportunity]
    code_bindings: [JobPost]
    status: stable
    evidence: [pk_jobvision_jobpost_overview, source_glossary, product_content_decisions]

  - id: job_position
    concept_kind: communication_concept
    authority:
      meaning_owner: design_language
      language_owner: design_language
      product_source: not_applicable
      migration_state: not_applicable
    production_alignment: {state: unverified}
    canonical_internal: موقعیت شغلی
    definition:
      product_content: >
        برچسب زمینه‌ای JobPost وقتی همان موجودیت به‌عنوان نقش یا جایگاهی
        ارائه می‌شود که سازمان برای آن نیرو می‌خواهد؛ نه یک entity جداگانه.
    preferred:
      default: موقعیت شغلی
    use_when:
      - اشاره به نقش، مسئولیت‌ها، شرایط یا تناسب شغلی
      - اقدام کارجو برای ارسال درخواست یا تصمیم جذب دربارهٔ نقش
    avoid_when:
      - ثبت، ویرایش، انتشار، وضعیت، انقضا، سهمیه یا metadata آگهی
    domains: [jobseeker, employer, ats]
    visibility: [public, internal]
    relations:
      same_entity_as: job_post
      distinct_from: [job_opportunity]
    status: stable
    evidence: [pk_jobvision_jobpost_overview, product_content_decisions]

  - id: job_opportunity
    concept_kind: communication_concept
    authority:
      meaning_owner: design_language
      language_owner: design_language
      product_source: not_applicable
      migration_state: not_applicable
    production_alignment: {state: unverified}
    canonical_internal: فرصت شغلی
    definition:
      product_content: امکان پیدا کردن یا شروع یک شغل؛ نه یک موجودیت دقیق محصول.
    preferred:
      default: فرصت شغلی
    use_when: [discovery, recommendation, general_product_copy]
    avoid_when: [specific_product_entity, status_or_metadata]
    domains: [jobseeker, marketing]
    visibility: [public]
    relations:
      distinct_from: [job_post, job_position]
    status: stable
    evidence: [product_content_decisions]

  - id: recruitment
    concept_kind: process
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: unresolved
      migration_state: needs_product_knowledge_reference
    production_alignment: {state: unverified}
    canonical_internal: جذب
    definition:
      product_content: >
        فرایند پیدا کردن، بررسی، ارزیابی و پیش بردن افراد تا رسیدن
        به تصمیم استخدام.
    preferred:
      default: جذب
    examples: [فرایند جذب, درخواست جذب, تیم جذب, در حال جذب]
    relations:
      leads_to: hiring
      distinct_from: [hiring]
    domains: [employer, ats]
    visibility: [public, internal]
    status: stable
    evidence: [product_content_decisions]

  - id: hiring
    concept_kind: outcome
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: unresolved
      migration_state: needs_product_knowledge_reference
    production_alignment: {state: unverified}
    canonical_internal: استخدام
    definition:
      product_content: >
        تصمیم یا نتیجه‌ای که فرد در آن برای یک موقعیت وارد رابطهٔ استخدامی می‌شود.
    preferred:
      default: استخدام
    examples: [استخدام شد, تاریخ استخدام, تصمیم استخدام]
    relations:
      result_of: recruitment
      distinct_from: [recruitment]
    domains: [employer, ats, jobseeker]
    visibility: [public, internal]
    status: stable
    evidence: [product_content_decisions]

  # People and organizations
  - id: employer_organization
    concept_kind: entity
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: سازمان
    definition:
      source: کارفرمای ثبت‌شده در سامانه که می‌تواند آگهی منتشر کند.
      product_content: سازمانی که از محصولات کارفرمایی جاب‌ویژن استفاده می‌کند.
    preferred:
      default: سازمان
      jobseeker: شرکت
      employer: سازمان
      ats: سازمان
      admin: سازمان
    allowed: [سازمان, شرکت]
    avoid: [مجموعه, بنگاه]
    forbidden:
      - {label: کارفرما, scope: entity_label, source: design_language}
    domains: [jobseeker, employer, ats, admin]
    visibility: [public, internal]
    relations:
      distinct_from: [employer_actor, operator]
    code_bindings: [Company]
    status: stable
    evidence: [source_glossary, product_content_decisions]

  - id: employer_actor
    concept_kind: role
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: pk_jobvision_glossary_employer_actor
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: کارفرما
    definition:
      product_content: فرد یا نقش انسانی‌ای که از طرف یک سازمان در فرایند جذب نیرو عمل می‌کند.
    preferred:
      default: کارفرما
    domains: [jobseeker, employer, ats]
    visibility: [public, internal]
    relations:
      acts_for: employer_organization
      distinct_from: [employer_organization, operator]
    status: stable
    evidence: [pk_jobvision_glossary_employer_actor, product_content_decisions]

  - id: operator
    concept_kind: role
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: رابط
    definition:
      source: کاربری که از طرف یک سازمان در پنل کارفرما کار می‌کند.
    preferred:
      default: رابط
    forbidden:
      - {label: اپراتور, scope: concept, source: product_knowledge_snapshot}
      - {label: کاربر سازمان, scope: concept, source: product_knowledge_snapshot}
      - {label: نمایندهٔ کارفرما, scope: concept, source: product_knowledge_snapshot}
    domains: [employer, admin]
    visibility: [internal, admin]
    relations:
      acts_for: employer_organization
      distinct_from: [employer_actor, job_fair_applier]
    code_bindings: [Operator]
    status: draft
    evidence: [source_glossary]

  - id: system_operator
    concept_kind: role
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: رابط سیستمی
    definition:
      source: رابطی که توسط جاب‌ویژن از طرف سازمان ساخته می‌شود.
    domains: [employer, admin]
    visibility: [internal, admin]
    code_bindings: [Operator]
    status: needs_decision
    open_questions:
      - نشانگر سیستمی و تفاوت رفتاری آن با رابط عادی دقیقاً چیست؟
    evidence: [source_glossary]

  - id: jobseeker
    concept_kind: role
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: کارجو
    definition:
      source: کاربری که برای یافتن شغل ثبت‌نام کرده است.
      product_content: >
        فردی که در جاب‌ویژن به دنبال فرصت شغلی است یا برای یک موقعیت
        درخواست شغلی فرستاده است.
    preferred:
      default: کارجو
    avoid: [متقاضی, داوطلب]
    forbidden:
      - {label: کاندید, scope: concept, source: design_language}
      - {label: کاندیدا, scope: concept, source: design_language}
      - {label: جویای کار, scope: concept, source: design_language}
    domains: [jobseeker, employer]
    visibility: [public, internal]
    relations:
      distinct_from: [ats_candidate]
    code_bindings: [Candidate]
    status: stable
    evidence: [source_glossary, product_content_decisions]

  - id: ats_candidate
    concept_kind: role
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: unresolved
      migration_state: needs_product_knowledge_reference
    production_alignment: {state: unverified}
    canonical_internal: کاندیدا
    definition:
      product_content: >
        فردی که در ATS برای یک یا چند موقعیت شغلی در حال بررسی است؛
        چه خودش درخواست شغلی فرستاده باشد و چه recruiter او را اضافه کرده باشد.
    preferred:
      ats: کاندیدا
    allowed: [کاندیدای جذب]
    avoid: [متقاضی, کارجو, داوطلب]
    domains: [ats]
    visibility: [public, internal]
    relations:
      distinct_from: [jobseeker]
    status: stable
    evidence: [product_content_decisions]

  - id: industry
    concept_kind: taxonomy
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: صنعت
    definition:
      source: حوزهٔ فعالیت کسب‌وکار سازمان که از بیس‌دیتا انتخاب می‌شود.
    preferred:
      default: صنعت
    forbidden:
      - {label: حوزهٔ فعالیت, scope: concept, source: product_knowledge_snapshot}
      - {label: زمینهٔ کاری, scope: concept, source: product_knowledge_snapshot}
      - {label: رستهٔ شغلی, scope: concept, source: product_knowledge_snapshot}
    relations:
      distinct_from: [job_category]
    code_bindings: [CompanyIndustry]
    domains: [jobseeker, employer, admin]
    visibility: [public, internal]
    status: draft
    evidence: [source_glossary]

  - id: company_authentication
    concept_kind: process
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: احراز هویت سازمان
    definition:
      source: >
        جریان سه‌گامی اثبات ارتباط رابط با اشخاص ثبت‌شدهٔ سازمان؛ شامل
        کد پیامکی، شاهکار و تطبیق با فهرست اشخاص سازمان.
    preferred:
      default: احراز هویت سازمان
    forbidden:
      - {label: تأیید سازمان, scope: concept, source: product_knowledge_snapshot}
      - {label: وریفای سازمان, scope: concept, source: product_knowledge_snapshot}
      - {label: احراز شاهکار, scope: concept, source: product_knowledge_snapshot}
    relations:
      distinct_from: [company_activation]
    code_bindings: [CompanyAuthentication]
    domains: [employer, admin]
    visibility: [public, internal]
    status: draft
    evidence: [source_glossary]

  - id: similar_company
    concept_kind: system_flag
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: سازمان مشابه
    definition:
      source: >
        سازمانی که یکی از پنج فیلد نام ثبتی، نام فارسی، نام انگلیسی،
        وب‌سایت یا تلفنش دقیقاً با سازمان دیگری برابر است.
    preferred:
      admin: سازمان مشابه
    forbidden:
      - {label: سازمان تکراری, scope: concept, source: product_knowledge_snapshot}
      - {label: سازمان دوتایی, scope: concept, source: product_knowledge_snapshot}
    domains: [admin]
    visibility: [admin, internal]
    code_bindings: [SimilarCompanyId, SimilarReasonId]
    status: draft
    evidence: [source_glossary]

  - id: merge_company
    concept_kind: admin_action
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: ادغام سازمان
    definition:
      source: انتقال داده و موجودی یک سازمان به سازمان دیگر و حذف سازمان مبدأ.
    preferred:
      admin: ادغام سازمان
    forbidden:
      - {label: مرج, scope: concept, source: product_knowledge_snapshot}
      - {label: یکی‌سازی سازمان, scope: concept, source: product_knowledge_snapshot}
    domains: [admin]
    visibility: [admin, internal]
    code_bindings: [MergeCompany]
    status: draft
    evidence: [source_glossary]

  - id: company_formal_info
    concept_kind: data_object
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: اطلاعات رسمی سازمان
    definition:
      source: هویت فاکتوری سازمان شامل شناسهٔ ملی، عنوان حقوقی، نشانی و کد پستی.
    preferred:
      employer: اطلاعات رسمی سازمان
      billing: اطلاعات رسمی
      admin: اطلاعات رسمی سازمان
    forbidden:
      - {label: اطلاعات حقوقی, scope: concept, source: product_knowledge_snapshot}
      - {label: اطلاعات فاکتور, scope: concept, source: product_knowledge_snapshot}
      - {label: اطلاعات مالیاتی, scope: concept, source: product_knowledge_snapshot}
    domains: [employer, billing, admin]
    visibility: [public, internal]
    relations:
      distinct_from: [company_authentication, company_profile]
      reconciles_source_entries: [company_formal_info, formal_info]
    code_bindings: [CompanyFormalInfo]
    status: stable
    evidence: [source_glossary]

  - id: account_manager
    concept_kind: internal_role
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: اکانت‌منیجر
    definition:
      source: کارمند جاب‌ویژن که مسئول مجموعه‌ای از سازمان‌هاست؛ تخصیص بر اساس صنعت.
    preferred:
      internal: اکانت‌منیجر
    forbidden:
