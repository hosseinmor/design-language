decision_log:
  - id: DEC-001
    term_ids: [job_post]
    decided_on: 2026-09-23
    outcome: >
      «آگهی شغلی» برچسب پیش‌فرض و برچسب تجربهٔ کارجو است؛ «آگهی» فقط
      در پنل کارفرما و ادمین، جایی که context روشن است، ترجیح دارد.
    rationale: >
      صورت کامل در سطح عمومی از ابهام با آگهی‌های غیرشغلی جلوگیری می‌کند؛
      صورت کوتاه در سطوح تخصصی تکرار غیرضروری «شغلی» را کم می‌کند.

  - id: DEC-002
    term_ids: [ats_candidate, jobseeker]
    decided_on: 2026-09-23
    outcome: >
      برچسب فارسی candidate در ATS «کاندیدا» است. «کارجو» فقط برای فردی
      به کار می‌رود که در جاب‌ویژن به دنبال شغل است.
    rationale: >
      کاندیدای ATS ممکن است بدون ارسال درخواست و مستقیماً توسط recruiter
      اضافه شده باشد؛ بنابراین «متقاضی» و «کارجو» همهٔ اعضای این مجموعه را
      پوشش نمی‌دهند.

  - id: DEC-003
    term_ids: [company_formal_info]
    decided_on: 2026-09-23
    outcome: >
      «اطلاعات رسمی سازمان» و «اطلاعات رسمی» یک concept هستند. نام مرجع
      «اطلاعات رسمی سازمان» است و برچسب کوتاه فقط در context پرداخت و فاکتور
      استفاده می‌شود.
    rationale: >
      هر دو عبارت به یک مجموعه‌داده شامل شناسهٔ ملی، عنوان حقوقی، نشانی و
      کد پستی اشاره می‌کنند و تفاوت آن‌ها صرفاً در میزان وضوح label است.

  - id: DEC-006
    term_ids: [resume, resume_language_variant, resume_completion_percentage]
    decided_on: 2026-09-23
    outcome: >
      در مدل محتوایی، رزومهٔ فارسی و رزومهٔ انگلیسی دو نسخهٔ زبانی از concept
      رزومه‌اند و به‌عنوان دو نوع entity مستقل شمرده نمی‌شوند.
    rationale: >
      واژه‌نامه یک concept کدی `Cv` را ثبت می‌کند، در حالی که شاخص‌های
      `CompletionPercentageFa` و `CompletionPercentageEn` و فیلدهای دوزبانه
      تفاوت بازنمایی‌های زبانی را نشان می‌دهند. این تصمیم دربارهٔ زبان محصول
      است و ساختار ذخیره‌سازی را تعیین نمی‌کند.

  - id: DEC-005
    term_ids:
      - ai_technology
      - ai_feature_family
      - ai_assistant
      - resume_ai_assistant
      - employer_assistant
      - external_ai_screener
    decided_on: 2026-09-23
    outcome: >
      فناوری، خانواده قابلیت‌ها، الگوی دستیار و نمونه‌های محصولی از هم جدا
      می‌مانند. دستیار هوشمند رزومه نمونهٔ تأییدشدهٔ ai_assistant است؛ دستیار
      کارفرما automation مستقلی است و ابزار غربالگری بیرونی integration داخلی
      نامطمئنی است.
    rationale: >
      تجربهٔ فعلی کارجو نام و رفتار دستیار هوشمند رزومه را نشان می‌دهد، اما
      واژه‌نامه برای دستیار کارفرما فقط رفتار automation و برای ابزار بیرونی
      وضعیت نامشخص یا غیرفعال ثبت کرده است. یکسان گرفتن آن‌ها مرز قابلیت، persona
      و integration را از بین می‌برد.

  - id: DEC-007
    term_ids: [job_post, job_position, job_opportunity]
    decided_on: 2026-10-22
    outcome: >
      «آگهی شغلی» و «موقعیت شغلی» دو برچسب زمینه‌ای برای یک entity محصولی
      یعنی JobPost هستند. «آگهی شغلی» هنگام ساخت، مدیریت، انتشار، وضعیت و
      metadata ترجیح دارد؛ «موقعیت شغلی» هنگام ارائهٔ نقش، شرایط، تناسب،
      درخواست کارجو و تصمیم جذب ترجیح دارد. «فرصت شغلی» عبارت عمومی برای
      discovery، recommendation و marketing است و نام دقیق این entity نیست.
    rationale: >
      سازمان برای یک موقعیت شغلی آگهی ثبت می‌کند، اما در مدل محصول آگهی و
      موقعیت دو entity مستقل نیستند. تفاوت واژه‌ها زاویهٔ ارائه و مرحلهٔ
      lifecycle را روشن می‌کند، بدون اینکه مدل دامنهٔ کاذب بسازد.

decision_queue:

  - id: DEC-004
    term_ids: [premium_subscription]
    question: مخاطب، امکانات و مدل محصول اشتراک ویژه چیست؟
    recommendation: تا دریافت product truth در محتوای جدید استفاده نشود.
    impact: high
    evidence_needed:
      - مالک و مخاطب اشتراک
      - فهرست مزایا و entitlementها
      - lifecycle و مدل قیمت‌گذاری
      - نسبت با Premium Insights سمت کارجو

  - id: DEC-008
    term_ids: [system_operator]
    question: رابط سیستمی دقیقاً چه رفتاری دارد و آیا کاربر آن را می‌بیند؟
    recommendation: تا روشن‌شدن رفتار و visibility، فقط برچسب داخلی استفاده و در UI عمومی ادعایی دربارهٔ آن ساخته نشود.
    impact: medium
    evidence_needed:
      - تعریف رفتار نشانگر سیستمی در Product Knowledge
      - سطح‌هایی که این مفهوم در آن دیده می‌شود
  - id: DEC-009
    term_ids: [rejection_queue]
    question: آیا صف رد هنوز در محصول وجود دارد و به برچسب کاربرپسند نیاز دارد؟
    recommendation: تا تأیید وضعیت فعلی، فقط برچسب داخلی «صف رد» در سطح داخلی استفاده شود.
    impact: low
    evidence_needed:
      - وضعیت فعلی پردازشگر صف رد در Product Knowledge
  - id: DEC-010
    term_ids: [external_ai_screener]
    question: نام رسمی ابزار غربالگری بیرونی چیست و آیا هنوز در محصول فعال است؟
    recommendation: تا تأیید نام و وضعیت، عبارت توصیفی داخلی استفاده و نام محصول ساخته نشود.
    impact: medium
    evidence_needed:
      - نام رسمی ابزار
      - وضعیت فعال‌بودن در محصول
evals:
  blocking:
    - id: RECRUITMENT_HIRING_COLLAPSED
      rule: جذب و استخدام به‌عنوان مترادف استفاده شده‌اند.
    - id: RESUME_LANGUAGE_VARIANT_AS_SEPARATE_ENTITY
      rule: نسخهٔ فارسی یا انگلیسی به‌عنوان رزومه‌ای مستقل از مفهوم رزومه شمرده شده است.
    - id: AI_CAPABILITY_MISLABELED_AS_ASSISTANT
      rule: یک محاسبه، پیشنهاد یا automation بدون تجربهٔ دستیارگونه «دستیار هوشمند» نامیده شده است.
  non_blocking:
    - id: JOB_POST_LABEL_CONTEXT_MISMATCH
      rule: برای entity واحد JobPost برچسبی انتخاب شده که با مرحلهٔ lifecycle یا زاویهٔ ارائه سازگار نیست.
