    visibility: [internal, admin]
    code_bindings: [AccountManager]
    status: draft
    evidence: [source_glossary]

  # Resume and application concepts
  - id: blue_collar_job_post
    concept_kind: derived_classification
    authority:
      meaning_owner: product_knowledge
      language_owner: design_language
      product_source: source_glossary
      migration_state: source_linked
    production_alignment: {state: unverified}
    canonical_internal: آگهی یقه آبی
    definition:
      source: آگهی‌ای که همهٔ دسته‌های شغلی‌اش سطح شغلی پیش‌فرض ۲ دارند.
    preferred:
      default: آگهی یقه آبی
    forbidden:
      - {label: آگهی کارگری, scope: concept, source: product_knowledge_snapshot}
      - {label: آگهی سطح پایین, scope: concept, source: product_knowledge_snapshot}
      - {label: مشاغل ساده, scope: concept, source: product_knowledge_snapshot}
    domains: [jobseeker, employer, admin]
    visibility: [public, internal]
    code_bindings: [IsBlueCollarJob, isLowLevel]
