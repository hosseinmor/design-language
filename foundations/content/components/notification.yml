schema_version: "0.1"
id: content.component.notification
title: قرارداد محتوایی Notification
status: draft
language: fa-IR
scope:
  - inline-notification
  - toast
  - notification-message
  - notification-action
  - dismiss
  - timeout-indicator
  - announcement

depends_on:
  voice: content.foundation.product_voice
  terminology: content.foundation.terminology
  localization: content.foundation.localization
  components:
    - content.component.button
  patterns:
    - content.pattern.notifications
    - content.pattern.error
    - content.pattern.confirmation
  design_system:
    - design-system.component.notification
    - design-system.accessibility.dynamic-content-and-feedback

goal: >
  outcome یا state واقعی باید در anatomy درست Inline Notification یا Toast با
  Message مستقل، context لازم، حداکثر یک action و announcement متناسب قرار
  بگیرد؛ بدون اختراع timing، stacking یا runtime behavior.

tone_profiles:
  info: informational_feedback
  success: success_feedback
  warning: warning_feedback
  error: error_feedback

sources:
  - id: design_system_notification
    type: design_system_component
    reference: design-system.component.notification
    state: verified
  - id: notification_pattern
    type: content_pattern
    reference: content.pattern.notifications
    state: verified
  - id: error_pattern
    type: content_pattern
    reference: content.pattern.error
    state: verified
  - id: confirmation_pattern
    type: content_pattern
    reference: content.pattern.confirmation
    state: verified
  - id: dynamic_feedback_accessibility
    type: accessibility_standard
    reference: design-system.accessibility.dynamic-content-and-feedback
    state: canonical
  - id: button_contract
    type: content_component
    reference: content.component.button
    state: draft
  - id: product_voice
    type: content_foundation
    reference: content.foundation.product_voice
    state: draft
  - id: terminology
    type: content_foundation
    reference: content.foundation.terminology
    state: draft
  - id: localization
    type: content_foundation
    reference: content.foundation.localization
    state: draft
  - id: product_content_decisions
    type: operational_decision
    state: working_decisions

source_boundaries:
  source_derived:
    - Inline Notification و Toast دو component identity مستقل‌اند.
    - severityهای استاندارد Info، Success، Warning و Error هستند.
    - Inline Message و Toast Message required و بخش‌های دیگر conditional هستند.
    - Notification حداکثر یک action و dismiss label فارسی «بستن» دارد.
    - timeout indicator عمر auto-dismiss است، نه task progress.
    - severity و announcement urgency مستقل‌اند و Toast focus نمی‌گیرد (مالک: accessibility).
  product_content_decisions:
    - الگوی فارسی Message، Description، Title و action.
    - جلوگیری از تکرار roleها و mapping recovery به presentation ماندگار.
  excluded:
    - timeout duration، stacking، queue، placement و default dismissibility.
    - runtime semantic props و live-region implementation.
    - business outcome، recovery و Undo availability.

component_model:
  inline_notification:
    identity: persistent_contextual_feedback
    required: [message]
    optional: [description, action, dismiss]
  toast:
    identity: transient_floating_feedback
    required: [message]
    optional: [title, action, dismiss, timeout_indicator]
  shared_type_axis: forbidden

# مجموعهٔ severity و treatmentها از Design System خوانده می‌شود (NTC-003 فقط wording).
severity_model:
  owner: design-system.pattern.notifications
  allowed: [info, success, warning, error]
  excluded:
    danger: destructive intent before action
    high: Toast contrast treatment

role_model:
  message: نتیجه یا وضعیت اصلی و مستقل
  description: context، consequence یا recovery تکمیلی Inline Notification
  title: دسته‌بندی یا object تکمیلی و اختیاری Toast
  action: حداکثر یک navigation یا operation معنادار
  dismiss: پنهان‌کردن feedback با accessible name «بستن»
  timeout_indicator: باقی‌ماندهٔ عمر auto-dismiss Toast

# تعداد action، Link/Button و ماندگاری action متعلق به Design System است.
action_model:
  owner: design-system.pattern.notifications
  navigation: Link
  operation: Button
  maximum: 1
  undo: requires_confirmed_safe_available_recovery
  transient_requirement: action ضروری به Toast ناپایدار وابسته نباشد.
  high_toast_button: not_handoff_ready

# urgency، focus، autofocus و بازخورد تکراری متعلق به accessibility و Design System است.
accessibility_model:
  owner: design-system.accessibility.dynamic-content-and-feedback
  content_scope: accessible name و Tooltip فارسی dismiss («بستن») و متن مستقل از رنگ

rules:
  - id: NTC-002
    obligation: must_not
    dimension: classification
    key: shared_type_axis
    statement: Inline Notification و Toast یک component با Type axis مشترک فرض نشوند.
    evidence: [design_system_notification]
  - id: NTC-003
    obligation: must
    dimension: clarity
    key: wording_matches_severity
    statement: Message با معنی severity انتخاب‌شده هم‌خوان باشد؛ Warning ریسک را بگوید نه شکست را، و Info نتیجهٔ Success یا Error را القا نکند.
    evidence: [design_system_notification, notification_pattern]
  - id: NTC-005
    obligation: must
    dimension: clarity
    key: required_independent_message
    statement: Message required باشد و نتیجه یا وضعیت واقعی را مستقل و روشن نام ببرد.
    evidence: [design_system_notification, notification_pattern]
  - id: NTC-006
    obligation: must
    dimension: structure
    key: description_adds_context
    statement: Inline Description فقط context، consequence یا recovery تکمیلی و غیرتکراری اضافه کند.
    evidence: [design_system_notification, product_content_decisions]
  - id: NTC-007
    obligation: must
    dimension: structure
    key: optional_title_adds_context
    statement: Toast Title فقط در صورت افزودن دسته‌بندی یا object تازه استفاده شود و Message را تکرار نکند.
    evidence: [design_system_notification, product_content_decisions]
  - id: NTC-008
    obligation: must_not
    dimension: structure
    key: transient_copy_scope
    statement: متن Toast confirmation، instruction حیاتی یا recovery ماندگار را حمل نکند و فقط بازخورد کوتاه و خودبسنده باشد.
    evidence: [design_system_notification, notification_pattern]
  - id: NTC-010
    obligation: must
    dimension: action
    key: match_link_button_semantics
    statement: navigation از Link و operation از Button با label نتیجه‌محور استفاده کند.
    evidence: [design_system_notification, button_contract]
  - id: NTC-011
    obligation: must
    dimension: action
    key: confirmed_undo_and_transient_action
    statement: Undo یا action ضروری فقط با behavior تأییدشده و فرصت دسترسی کافی ارائه شود.
    evidence: [notification_pattern, dynamic_feedback_accessibility]
  - id: NTC-012
    obligation: must
    dimension: accessibility
    key: accessible_dismiss_name
    statement: Dismiss موجود accessible name و Tooltip فارسی «بستن» داشته باشد.
    evidence: [design_system_notification, notification_pattern]
  - id: NTC-014
    obligation: must_not
    dimension: terminology
    key: timeout_indicator_not_progress
    statement: Timeout indicator در copy یا accessible name «پیشرفت»، «در حال تکمیل» یا درصد outcome نامیده نشود.
    evidence: [design_system_notification]
  - id: NTC-020
    obligation: must
    dimension: terminology
    key: preserve_surface_terms
    statement: action و object با terminology همان audience و surface نامیده شوند.
    evidence: [terminology]
  - id: NTC-021
    obligation: must
    dimension: localization
    key: format_and_isolate_variables
    statement: count، amount، date، identifier، نام و متن دوجهته با formatter و bidi contract معتبر نمایش داده شوند.
    evidence: [localization]

examples:
  inline_warning:
    severity: warning
    message: اتصال ناپایدار است
    description: ممکن است ذخیرهٔ تغییرات بیشتر طول بکشد.
  success_toast:
    severity: success
    message: تغییرات رزومه ذخیره شد.
    condition: save_confirmed
  error_inline_with_action:
    severity: error
    message: رزومه بارگذاری نشد
    description: اتصال اینترنت را بررسی و دوباره تلاش کنید.
    action: تلاش دوباره
    condition: retry_confirmed

unknowns:
  - Toast timeout duration
  - stacking، queue و simultaneous limit
  - responsive placement
  - default dismissibility و persistence
  - actionable Toast timing و fallback
  - executable announcement behavior
  - inverse Button و Icon Button treatment برای High Toast

retired_rules:
  - id: NTC-001
    superseded_by: [design-system.pattern.notifications]
    reason: انتخاب Inline Notification یا Toast تصمیم presentation در Design System است.
  - id: NTC-004
    superseded_by: [design-system.pattern.notifications, design-system.component.notification]
    reason: Danger و High contrast به‌عنوان severity را Design System رد کرده است.
  - id: NTC-009
    superseded_by: [design-system.pattern.notifications]
    reason: سقف تعداد action تصمیم composition در Design System است؛ واقعی‌بودن action در NTC-011 می‌ماند.
  - id: NTC-013
    superseded_by: [NTF-014]
    reason: تکرار قاعدهٔ الگو دربارهٔ اختراع‌نکردن timing، stacking و dismissibility.
  - id: NTC-015
    superseded_by: [design-system.pattern.notifications, design-system.accessibility.dynamic-content-and-feedback]
    reason: فوریت announcement سازوکار دسترس‌پذیری است، نه wording.
  - id: NTC-016
    superseded_by: [design-system.pattern.notifications, design-system.accessibility.dynamic-content-and-feedback]
    reason: focus و autofocus در Toast رفتار تعاملی است؛ عین NTF-012.
  - id: NTC-017
    superseded_by: [design-system.pattern.notifications, design-system.accessibility.dynamic-content-and-feedback]
    reason: هماهنگی Toast، focus و live announcement سازوکار تعاملی است.
  - id: NTC-018
    superseded_by: [NTF-005, NTF-015]
    reason: تکرار قاعدهٔ الگو؛ NTF-005 برای Success و NTF-015 برای Error.
  - id: NTC-019
    superseded_by: [design-system.pattern.notifications]
    reason: ماندگاری recovery و action یک شکاف باز presentation در Design System است و در copy پر نمی‌شود.
  - id: NTC-022
    superseded_by: [NTF-008, NTF-009]
    reason: تکرار قواعد الگو دربارهٔ پیام کلی و هیجان‌زده.

evaluation_source: ../../../ai/evals/content/notification-content-cases.yml
